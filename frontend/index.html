<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iris Classifier</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f7;
      display: flex; justify-content: center;
      padding: 40px 16px; margin: 0;
    }
    .card {
      background: #fff; width: 100%; max-width: 440px;
      padding: 28px; border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    h1 { margin-top: 0; font-size: 1.5rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    label { font-size: 0.85rem; font-weight: 600; color: #444; }
    input {
      width: 100%; padding: 10px; margin-top: 4px;
      border: 1px solid #ccc; border-radius: 6px; font-size: 1rem;
    }
    button {
      margin-top: 20px; width: 100%; padding: 12px;
      background: #4f46e5; color: #fff; border: none;
      border-radius: 8px; font-size: 1rem; cursor: pointer;
    }
    button:disabled { background: #a5a3e8; cursor: wait; }
    #result { margin-top: 22px; }
    .bar-row { margin: 8px 0; font-size: 0.9rem; }
    .bar-bg { background: #eee; border-radius: 4px; height: 10px; margin-top: 3px; }
    .bar { background: #4f46e5; height: 10px; border-radius: 4px; }
    .error { color: #b91c1c; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🌸 Iris Flower Classifier</h1>

    <form id="form">
      <div class="grid">
        <div>
          <label for="sepal_length">Sepal length (cm)</label>
          <input type="number" step="0.1" min="0.1" id="sepal_length" value="5.1" required />
        </div>
        <div>
          <label for="sepal_width">Sepal width (cm)</label>
          <input type="number" step="0.1" min="0.1" id="sepal_width" value="3.5" required />
        </div>
        <div>
          <label for="petal_length">Petal length (cm)</label>
          <input type="number" step="0.1" min="0.1" id="petal_length" value="1.4" required />
        </div>
        <div>
          <label for="petal_width">Petal width (cm)</label>
          <input type="number" step="0.1" min="0.1" id="petal_width" value="0.2" required />
        </div>
      </div>
      <button type="submit" id="btn">Classify</button>
    </form>

    <div id="result"></div>
  </div>

  <script>
    const API_URL = "/predict";   // 🔄 CHANGED: relative URL, same server as this page
    const FIELDS = ["sepal_length", "sepal_width", "petal_length", "petal_width"];

    const form = document.getElementById("form");
    const btn = document.getElementById("btn");
    const result = document.getElementById("result");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = "Predicting...";
      result.innerHTML = "";

      const payload = {};
      FIELDS.forEach((f) => (payload[f] = parseFloat(document.getElementById(f).value)));

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(JSON.stringify(data.detail));

        const bars = Object.entries(data.probabilities)
          .map(([name, p]) => `
            <div class="bar-row">
              ${name} — ${(p * 100).toFixed(1)}%
              <div class="bar-bg"><div class="bar" style="width:${p * 100}%"></div></div>
            </div>`)
          .join("");

        result.innerHTML = `
          <h2>Prediction: ${data.prediction}</h2>
          <p>Confidence: <strong>${(data.confidence * 100).toFixed(1)}%</strong></p>
          ${bars}`;
      } catch (err) {
        result.innerHTML = `<p class="error">❌ ${err.message}</p>`;   // 🔄 CHANGED
      } finally {
        btn.disabled = false;
        btn.textContent = "Classify";
      }
    });
  </script>
</body>
</html>
